name: Generate shared debug keystore

on:
  workflow_dispatch:

jobs:
  gen-debug-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "=====BEGIN BASE64====="
          base64 ~/.android/debug.keystore
          echo "=====END BASE64====="
