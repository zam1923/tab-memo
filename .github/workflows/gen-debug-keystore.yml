name: Generate shared debug keystore

on:
  workflow_dispatch:

permissions:
  secrets: write

jobs:
  gen-debug-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and register as Secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          BASE64=$(base64 -w 0 ~/.android/debug.keystore)
          gh secret set DEBUG_KEYSTORE_BASE64 --body "$BASE64" --repo ${{ github.repository }}
          echo "Secret registered successfully!"
