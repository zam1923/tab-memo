name: Generate shared debug keystore

on:
  workflow_dispatch:

jobs:
  gen-debug-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and output full Base64
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          # 1行で全部出力（改行なし）
          BASE64=$(base64 -w 0 ~/.android/debug.keystore)
          echo "FULL_BASE64_START"
          echo "$BASE64"
          echo "FULL_BASE64_END"
          echo "Length: ${#BASE64}"
