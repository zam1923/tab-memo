<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>タブメモ</title>
  <style>
    :root {
      --primary: #007aff;
      --danger: #ff3b30;
      --bg: #f2f2f7;
      --surface: #ffffff;
      --text: #1c1c1e;
      --secondary-text: #8e8e93;
      --border: #e5e5ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text);
    }
    .header {
      background: var(--surface);
      padding: 12px 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 10px 10px 0 0;
      background: var(--bg);
      color: var(--secondary-text);
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
      user-select: none;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      background: var(--surface);
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    .tab.dragging { opacity: 0.5; }
    .tab-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
      display: none;
      line-height: 1;
    }
    .tab:hover .tab-delete { display: block; }
    .tab-add {
      flex-shrink: 0;
      padding: 8px 12px;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
    }
    .list-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .count-bar {
      font-size: 12px;
      color: var(--secondary-text);
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .memo-item {
      background: var(--surface);
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      user-select: none;
      position: relative;
      transition: transform 0.1s;
    }
    .memo-item.dragging { opacity: 0.5; }
    .memo-header {
      display: flex;
      align-items: center;
      padding: 16px 14px;
      cursor: pointer;
      gap: 12px;
    }
    .memo-title {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .memo-delete {
      color: var(--danger);
      font-size: 18px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 32px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,122,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .fab:active { transform: scale(0.92); }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--surface);
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .modal.show { display: flex; }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-back {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 16px;
      cursor: pointer;
    }
    .modal-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .view-mode {
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .view-mode.empty { color: var(--secondary-text); font-style: italic; }
    .edit-mode {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    .edit-mode.show { display: flex; }
    .edit-title {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
    }
    .edit-body {
      flex: 1;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: none;
      font-family: inherit;
      line-height: 1.6;
      outline: none;
    }
    .edit-title:focus, .edit-body:focus { border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="header">
    <h1>タブメモ</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="list-area">
    <div class="count-bar" id="countBar"></div>
    <div id="memoList"></div>
  </div>
  <button class="fab" onclick="addMemo()">+</button>
  
  <div class="modal" id="memoModal">
    <div class="modal-header">
      <button class="modal-back" onclick="closeModal()">&lt; 戻る</button>
      <div class="modal-title" id="modalTitle"></div>
    </div>
    <div class="modal-body">
      <div class="view-mode" id="viewMode"></div>
      <div class="edit-mode" id="editMode">
        <input class="edit-title" id="editTitle" placeholder="見出し">
        <textarea class="edit-body" id="editBody" placeholder="メモを入力..."></textarea>
      </div>
    </div>
  </div>

  <script>
    let data = JSON.parse(localStorage.getItem('tabMemoData')) || {
      tabs: [{ id: 't1', name: 'メイン', memos: [] }],
      activeTab: 't1'
    };
    let currentMemoIdx = null;
    let longPressTimer;
    let dragTarget = null;
    let isLongPress = false;

    const save = () => localStorage.setItem('tabMemoData', JSON.stringify(data));
    const currentTab = () => data.tabs.find(t => t.id === data.activeTab) || data.tabs[0];

    function render() {
      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML = data.tabs.map(t => `
        <div class="tab ${t.id === data.activeTab ? 'active' : ''}"
          draggable="true"
          onmousedown="startTabPress(event, '${t.id}')" ontouchstart="startTabPress(event, '${t.id}')"
          onmouseup="clearPress()" ontouchend="clearPress()"
          ondragstart="handleDragStart(event, 'tab', '${t.id}')"
          ondragover="event.preventDefault()"
          ondrop="handleDrop(event, 'tab', '${t.id}')"
          ondragend="handleDragEnd(event)"
          onclick="if(!isLongPress && '${t.id}' !== data.activeTab) { data.activeTab='${t.id}'; save(); render(); }">
          ${t.name}
          <button class="tab-delete" onclick="event.stopPropagation();deleteTab('${t.id}')">×</button>
        </div>`).join('') + 
        '<button class="tab-add" onclick="addTab()">+</button>';

      const tab = currentTab();
      document.getElementById('countBar').innerText = `メモ: ${tab.memos.length}件`;
      document.getElementById('memoList').innerHTML = tab.memos.map((m, i) => `
        <div class="memo-item"
          draggable="true"
          onmousedown="startMemoPress(event, ${i})" ontouchstart="startMemoPress(event, ${i})"
          onmouseup="clearPress()" ontouchend="clearPress()"
          ondragstart="handleDragStart(event, 'memo', ${i})"
          ondragover="event.preventDefault()"
          ondrop="handleDrop(event, 'memo', ${i})"
          ondragend="handleDragEnd(event)"
          onclick="if(!isLongPress) openModal(${i})">
          <div class="memo-header">
            <div class="memo-title">${m.title || '（無題）'}</div>
            <button class="memo-delete" onclick="event.stopPropagation();deleteMemo(${i})">×</button>
          </div>
        </div>`).join('');
    }

    function startTabPress(e, id) {
      isLongPress = false;
      longPressTimer = setTimeout(() => {
        isLongPress = true;
        if (id === data.activeTab) {
          const newName = prompt('タブ名を変更', data.tabs.find(t=>t.id===id).name);
          if (newName) { data.tabs.find(t=>t.id===id).name = newName; save(); render(); }
        }
      }, 500);
    }

    function startMemoPress(e, i) {
      isLongPress = false;
      longPressTimer = setTimeout(() => {
        isLongPress = true;
        openModal(i, true);
      }, 600);
    }

    function clearPress() { clearTimeout(longPressTimer); }

    function handleDragStart(e, type, target) {
      dragTarget = { type, target };
      e.target.classList.add('dragging');
    }

    function handleDrop(e, type, target) {
      e.preventDefault();
      if (!dragTarget || dragTarget.type !== type) return;
      if (type === 'tab') {
        const fromIdx = data.tabs.findIndex(t => t.id === dragTarget.target);
        const toIdx = data.tabs.findIndex(t => t.id === target);
        const [movedTab] = data.tabs.splice(fromIdx, 1);
        data.tabs.splice(toIdx, 0, movedTab);
      } else {
        const tab = currentTab();
        const [movedMemo] = tab.memos.splice(dragTarget.target, 1);
        tab.memos.splice(target, 0, movedMemo);
      }
      save(); render();
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      dragTarget = null;
    }

    function openModal(i, edit = false) {
      currentMemoIdx = i;
      const memo = currentTab().memos[i];
      document.getElementById('modalTitle').innerText = memo.title || 'メモ';
      const view = document.getElementById('viewMode');
      view.innerText = memo.body || '内容がありません';
      view.className = memo.body ? 'view-mode' : 'view-mode empty';
      
      view.onmousedown = () => { isLongPress = false; longPressTimer = setTimeout(switchToEditMode, 600); };
      view.ontouchstart = () => { isLongPress = false; longPressTimer = setTimeout(switchToEditMode, 600); };
      view.onmouseup = clearPress; view.ontouchend = clearPress;

      document.getElementById('editMode').classList.remove('show');
      view.style.display = 'block';
      if (edit) switchToEditMode();
      document.getElementById('memoModal').classList.add('show');
    }

    function switchToEditMode() {
      const tab = currentTab(); const memo = tab.memos[currentMemoIdx];
      document.getElementById('viewMode').style.display = 'none';
      const editEl = document.getElementById('editMode'); editEl.classList.add('show');
      const tIn = document.getElementById('editTitle'); const bIn = document.getElementById('editBody');
      tIn.value = memo.title; bIn.value = memo.body;
      tIn.oninput = e => { tab.memos[currentMemoIdx].title = e.target.value; document.getElementById('modalTitle').innerText = e.target.value || 'メモ'; save(); };
      bIn.oninput = e => { tab.memos[currentMemoIdx].body = e.target.value; save(); };
    }

    function closeModal() { document.getElementById('memoModal').classList.remove('show'); currentMemoIdx = null; render(); }

    function addMemo() {
      const tab = currentTab();
      tab.memos.unshift({ title: '', body: '' });
      save();
      openModal(0, true);
    }

    function deleteMemo(i) {
      if (confirm('このメモを削除しますか？')) {
        currentTab().memos.splice(i, 1);
        save(); render();
      }
    }

    function addTab() {
      const name = prompt('タブ名を入力');
      if (!name) return;
      const id = 't' + Date.now();
      data.tabs.push({ id, name, memos: [] });
      data.activeTab = id;
      save(); render();
    }

    function deleteTab(id) {
      if (data.tabs.length <= 1) return;
      if (!confirm('このタブを削除しますか？')) return;
      const idx = data.tabs.findIndex(t => t.id === id);
      data.tabs.splice(idx, 1);
      if (data.activeTab === id) data.activeTab = data.tabs[0].id;
      save(); render();
    }

    render();
  </script>
</body>
</html>
